name: Logs - comprobaciones de integración
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/member-logs-20261008]
jobs:
  python-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validar sintaxis
        run: python -m py_compile bot.py test_member_logs.py
      - name: Instalar dependencias
        run: python -m pip install -r requirements-ci.txt
      - name: Regresiones de logs
        run: python -m unittest test_member_logs -v
