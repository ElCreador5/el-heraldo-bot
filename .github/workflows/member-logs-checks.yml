name: Logs - comprobaciones de integración
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis
        run: python -m py_compile bot.py sqlite_recovery.py supabase_backup.py backup_job.py production_backup_scheduler.py test_member_logs.py test_member_departure_cards.py test_regressions.py test_release_report_only.py test_honeypot_selective_main.py test_honeypot_runtime.py test_raid_save_main.py
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar dependencias
        run: pip check
      - name: Comprobar rutas Volver y filas NH UX-03B
        run: python -m unittest discover -s tests -p 'test_ux_main_release.py' -v
      - name: Comprobar texto y compatibilidad de personalidad
        run: python -m unittest discover -s tests -p 'test_personality_copy_main.py' -v
      - name: Regresiones de logs
        run: python -m unittest test_member_logs test_member_departure_cards test_regressions test_release_report_only test_honeypot_selective_main test_honeypot_runtime test_raid_save_main -v
