name: Heraldo Lab - Python regressions

on:
  pull_request:
    branches: [Pruebas]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile bot.py test_regressions.py
      - name: Existing offline regression suite
        run: python -m unittest -v test_regressions.py
      - name: Lab component validation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
