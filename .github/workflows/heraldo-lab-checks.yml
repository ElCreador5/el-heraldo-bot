name: Heraldo Lab - Python regressions

on:
  pull_request:
    branches: [Pruebas, main]
  push:
    branches: [Pruebas]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-contract:
    name: ux-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-backup.txt
      - name: Instalar dependencias de pruebas aisladas
        run: python -m pip install -r requirements-ci.txt -r requirements-backup.txt
      - name: Comprobar entorno de pruebas
        run: python -m pip check
      - name: Internacionalización por servidor y detección de textos sin catálogo
        env:
          PYTHONPATH: "tests:."
        run: |
          python tools/i18n_audit.py
          python -m unittest -v test_i18n_catalog test_language_contract test_i18n_runtime test_i18n_commands
      - name: Contrato y matriz dinámica de todos los módulos visibles de setup
        env:
          PYTHONPATH: "tests:."
        run: python -m unittest discover -s tests -p 'test_ux_*.py' -v
      - name: Regresiones conductuales de paneles, confirmaciones y editores
        env:
          PYTHONPATH: "tests:."
        run: |
          python -m unittest -v \
            test_safety_regressions \
            test_button_palette \
            test_editor_drafts_behavior \
            test_configuration_preview \
            test_setup_editor_selectors \
            test_reaction_options_dropdown \
            test_setup_interaction_runtime \
            test_honeypot_concurrency \
            test_global_server_footer \
            test_honeypot_panel \
            test_honeypot_warning_publish \
            test_reaction_reports_ux \
            test_fusion_preview \
            test_message_editors \
            test_message_automation \
            test_report_reminders_and_date_format \
            test_case_action_buttons

  offline-regressions:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Instalar dependencia directa validada
        run: python -m pip install -r requirements-ci.txt
      - name: Instalar cifrado para regresiones aisladas
        run: python -m pip install -r requirements-backup.txt
      - name: Comprobar dependencias
        run: python -m pip check
      - name: Compile Python sources
        run: python -m py_compile bot.py sqlite_recovery.py supabase_backup.py backup_job.py production_backup_scheduler.py preupdate_gate.py h03_publication_adapter.py h03_startup_gate.py h03_release_handoff.py h03_railway_test_api.py h03_test_railway_release.py test_backup_runtime.py test_backup_scheduler.py tools/scheduled_lab_backup.py tools/backup_health.py evidence_archive.py message_payload.py message_automation.py message_components.py message_editor.py test_regressions.py test_member_logs.py
      - name: Existing offline regression suite
        run: python -m unittest -v test_regressions.py
      - name: Lab component validation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regresiones de Logs incorporadas desde main
        run: python -m unittest -v test_member_logs.py
