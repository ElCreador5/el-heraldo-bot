name: Main - selected settings promotion checks

on:
  push:
    branches:
      - promo-main-selected-settings-20261106
      - main
    paths:
      - 'bot.py'
      - 'autofeed_setup.py'
      - 'message_autofeeds.py'
      - 'message_automation.py'
      - 'message_publish.py'
      - 'message_payload.py'
      - 'main_case_management.py'
      - 'member_rejoin_restore.py'
      - 'main_pending_roles.py'
      - 'main_rejoin_setup.py'
      - 'tests/test_main_selected_settings.py'
      - '.github/workflows/main-selected-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile bot.py autofeed_setup.py message_autofeeds.py message_automation.py message_publish.py message_payload.py main_case_management.py member_rejoin_restore.py main_pending_roles.py main_rejoin_setup.py
      - name: Test selected settings
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m unittest discover -s tests -p 'test_main_selected_settings.py' -v
          python -m unittest discover -s tests -p 'test_main*.py' -v
          python -m unittest discover -s tests -p 'test_ux_main_release.py' -v
          python -m unittest discover -s tests -p 'test_purge_panel.py' -v
          python -m unittest discover -s tests -p 'test_personal_embeds_public.py' -v
