name: Autofeeds Lab checks

on:
  push:
    branches: [Pruebas]
    paths:
      - 'message_autofeeds.py'
      - 'message_automation.py'
      - 'bot.py'
      - 'locales/**'
      - 'tests/test_autofeeds.py'
      - '.github/workflows/autofeeds-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofeeds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile message_autofeeds.py message_automation.py bot.py
      - run: python -m unittest discover -s tests -p test_autofeeds.py -v
      - run: python -m unittest discover -s tests -p test_message_automation.py -v
      - run: python -m unittest discover -s tests -p test_i18n_commands.py -v
